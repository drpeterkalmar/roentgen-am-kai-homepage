name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # volle Git-Historie: Sitemap-lastmod je Seite aus dem Datum der letzten Änderung (scripts/postbuild.mjs)
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Schnelle Prüfungen vor dem Build: Lint + Node-Unit-Tests (tests/unit, Sekunden).
      # Die Playwright-Suiten (npm run test:e2e) laufen lokal gegen vite preview.
      - name: Lint
        run: npm run lint

      - name: Unit-Tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          # github.io ist die Staging-Seite: interne Platzhalter für die Praxis sichtbar lassen.
          # Release-Build (eigene Domain) ohne diese Variable → interne Platzhalter ausgeblendet.
          VITE_INTERNAL_NOTES: '1'
          # Beim Umzug auf die eigene Domain (röntgen-am-kai.at) PFLICHT, sonst laufen alle Assets ins Leere:
          # BASE_PATH: /

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
